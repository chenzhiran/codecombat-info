<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="copyright" content="CodeCombat Inc. codecombat.cn">
<meta name="author" content="CodeCombat 官方团队">
<title>扣哒考级 · CodeCombat 扣哒世界 · CCF GESP 考纲配套</title>
<style>
  :root{
    --bg-page:#eef2f9; --panel:#ffffff; --line:#e3e9f4;
    --brand:#ff6b35; --brand-2:#ff8f5e;
    --python:#2e9e5b; --cpp:#2563eb; --scratch:#8b5cf6; --exam:#0891b2;
    --text:#232b3d; --dim:#7c8aa3; --dim2:#9aa8bd;
    --shadow:0 10px 34px rgba(38,62,120,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,sans-serif;
    background:var(--bg-page);color:var(--text);overflow:hidden;font-size:14px;
  }
  .layout{display:flex;height:100vh}

  /* ============ 侧边栏 ============ */
  .sidebar{
    width:330px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(40,60,120,.05);z-index:20;
    transition:width .28s ease;
  }
  .sidebar.collapsed{width:64px}
  .sidebar.collapsed .brand-text,
  .sidebar.collapsed .brand-slogan,
  .sidebar.collapsed .search-wrap,
  .sidebar.collapsed .board-body,
  .sidebar.collapsed .foot{display:none}
  .sidebar.collapsed .brand{padding:12px 8px;justify-content:center;gap:0}
  .sidebar.collapsed .logo-link{display:flex;margin:0 auto}
  .sidebar.collapsed .logo-img{height:auto;width:46px}   /* 宽幅 logo 在 64px 窄栏中按宽度收缩 */
  .sidebar.collapsed .toggle{display:none}
  .sidebar.collapsed .board-head{justify-content:center;padding:12px 8px;position:relative}
  .sidebar.collapsed .board-head:hover{background:var(--soft)}
  .sidebar.collapsed .board-head .b-name,
  .sidebar.collapsed .board-head .b-sub,
  .sidebar.collapsed .board-head .chev{display:none}



  .brand{
    padding:12px 16px 12px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#fff8f4,#ffffff);
  }
  .brand-row{display:flex;align-items:center;gap:11px}
  .brand .logo-link{display:flex;align-items:center;flex-shrink:0;transition:.2s}
  .brand .logo-link:hover{transform:scale(1.04)}
  /* logo.webp 原始尺寸 358×84（约 4.26 : 1 的宽幅），只定高度、宽度自适应，绝不拉成方形 */
  .brand .logo-img{height:29px;width:auto;display:block}
  .brand-text{flex:1;min-width:0}
  .brand-text h1{font-size:17px;font-weight:800;letter-spacing:1.2px;white-space:nowrap;color:var(--text)}
  /* 一句话独占一行，放在 logo 与标题下方，字号小一档，避免与宽幅 logo 抢空间 */
  .brand-slogan{
    font-size:11px;color:var(--dim);line-height:1.55;margin-top:9px;letter-spacing:.2px;
  }
  .toggle{
    width:26px;height:26px;border:1px solid var(--line);border-radius:8px;background:#fff;
    color:var(--dim);cursor:pointer;font-size:11px;flex-shrink:0;transition:.2s;line-height:1;
  }
  .toggle:hover{border-color:var(--brand);color:var(--brand);background:#fff6f2}

  .search-wrap{padding:12px 16px 8px}
  .search-wrap input{
    width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:10px;
    font-size:12.5px;background:#f8fafd;outline:none;transition:.2s;font-family:inherit;
  }
  .search-wrap input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(255,107,53,.10)}

  .nav{flex:1;overflow-y:auto;padding:6px 0 40px}
  .nav::-webkit-scrollbar{width:7px}
  .nav::-webkit-scrollbar-thumb{background:#dae2ef;border-radius:4px}

  .board{--c:var(--brand);--soft:rgba(255,107,53,.09);margin-bottom:6px}
  .board.py{--c:var(--python);--soft:rgba(46,158,91,.09)}
  .board.cpp{--c:var(--cpp);--soft:rgba(37,99,235,.09)}
  .board.scratch{--c:var(--scratch);--soft:rgba(139,92,246,.09)}
  .board.exam{--c:var(--exam);--soft:rgba(8,145,178,.09)}

  .board-head{
    display:flex;align-items:center;gap:11px;padding:12px 18px;cursor:pointer;user-select:none;
    border-left:4px solid transparent;transition:.18s;
  }
  .board-head:hover{background:#f7f9fd}
  .board-head.open{border-left-color:var(--c);background:var(--soft)}
  .board-dot{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:var(--c);color:#fff;font-size:13px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.13);
  }
  .b-name{font-size:13.5px;font-weight:800;white-space:nowrap}
  .b-sub{font-size:10.5px;color:var(--dim2);font-weight:500;margin-left:auto;white-space:nowrap}
  .chev{font-size:9px;color:var(--dim2);transition:transform .25s;margin-left:6px}
  .board-head.open .chev{transform:rotate(90deg)}

  .board-body{overflow:hidden;max-height:0;transition:max-height .45s ease}
  /* 默认全展开：一个板块要装下"全部级别 × 每级全部单元"，所以要给足上限 */
  .board-body.open{max-height:40000px}

  .level{border-left:4px solid transparent}
  .level-head{
    display:flex;align-items:center;gap:9px;padding:9px 18px 9px 28px;cursor:pointer;user-select:none;
    transition:.16s;
  }
  .level-head:hover{background:#f7f9fd}
  .level-head.open{background:var(--soft)}
  .lv-badge{
    font-size:10px;font-weight:800;padding:2.5px 8px;border-radius:20px;flex-shrink:0;
    background:#fff;border:1px solid var(--c);color:var(--c);
  }
  .level-head .lv-title{font-size:12.5px;font-weight:800;color:var(--text);white-space:nowrap}
  .level-head .lv-world{font-size:10px;color:var(--dim2);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .level-head .chev{margin-left:2px}

  .units{overflow:hidden;max-height:0;transition:max-height .4s ease}
  .units.open{max-height:4000px}
  .unit{
    display:flex;align-items:flex-start;gap:9px;padding:7px 16px 7px 30px;cursor:pointer;
    border-left:4px solid transparent;transition:.15s;
  }
  .unit:hover{background:#f7f9fd}
  .unit.active{background:var(--soft);border-left-color:var(--c)}
  .unit .no{
    width:22px;height:20px;border-radius:6px;flex-shrink:0;background:#eef2f8;color:var(--dim2);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;margin-top:2px;
    letter-spacing:-.3px;
  }
  .unit.active .no{background:var(--c);color:#fff}
  .unit.ready .no{background:#dcf5e7;color:var(--python)}
  .unit.active.ready .no{background:var(--c);color:#fff}
  .unit .u-txt{flex:1;min-width:0}
  .unit .u-g{font-size:12.5px;color:#4a5a72;font-weight:600;line-height:1.4}
  .unit.active .u-g{color:var(--c);font-weight:800}
  .unit .u-k{font-size:10.5px;color:var(--dim2);line-height:1.45;margin-top:1px}
  .unit .u-tag{
    display:inline-block;font-size:9px;padding:1px 6px;border-radius:5px;margin-left:5px;
    background:#e2f7ec;color:#1f8c4d;font-weight:700;vertical-align:1px;white-space:nowrap;
  }

  .foot{padding:11px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--dim2);line-height:1.7;background:#fbfcfe}
  .foot a{color:var(--brand);text-decoration:none;font-weight:700}
  .foot a:hover{text-decoration:underline}

  /* ============ 内容区 ============ */
  .content{flex:1;position:relative;display:flex;flex-direction:column;min-width:0}
  .frame-wrap{flex:1;position:relative}
  iframe.unit-frame{width:100%;height:100%;border:none;background:#fff;display:block}

  .welcome{position:absolute;inset:0;overflow-y:auto;padding:38px 46px 60px}
  .welcome::-webkit-scrollbar{width:8px}
  .welcome::-webkit-scrollbar-thumb{background:#d3dcec;border-radius:4px}
  .hero-card{
    position:relative;border-radius:22px;padding:40px 44px;overflow:hidden;color:#fff;
    background:linear-gradient(120deg,#16202f 0%,#2b3a52 44%,#a8431c 132%);
    box-shadow:0 20px 50px rgba(28,42,70,.28);
  }
  .hero-card::after{
    content:"";position:absolute;right:-60px;bottom:-90px;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,140,80,.5),transparent 68%);
  }
  .hero-card .kicker{font-size:11px;letter-spacing:3px;color:#ffb894;font-weight:700;margin-bottom:12px}
  .hero-card h2{font-size:31px;font-weight:800;letter-spacing:1px;margin-bottom:14px;line-height:1.3}
  .hero-card p{font-size:13.5px;line-height:2;color:#d8e0ef;max-width:780px}
  .hero-card .hl{color:#ffb894;font-weight:700}
  .hero-card .hero-tag{
    display:inline-flex;align-items:center;gap:7px;padding:6px 15px;border-radius:20px;margin-bottom:16px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
    font-size:11.5px;font-weight:800;color:#ffd9c4;letter-spacing:.8px;position:relative;z-index:2;
  }

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0 30px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:26px;font-weight:800;letter-spacing:.5px}
  .stat span{font-size:11.5px;color:var(--dim);margin-top:5px;display:block}
  .stat.s1 b{color:var(--python)} .stat.s2 b{color:var(--cpp)} .stat.s3 b{color:var(--scratch)} .stat.s4 b{color:var(--exam)}

  .sec-title{font-size:16px;font-weight:800;margin:6px 0 16px;display:flex;align-items:center;gap:9px}
  .sec-title::before{content:"";width:5px;height:18px;border-radius:3px;background:var(--brand)}

  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px;cursor:pointer;
    transition:.22s;position:relative;overflow:hidden;box-shadow:var(--shadow);
  }
  .card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 18px 40px rgba(38,62,120,.16)}
  .card::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--c)}
  .card .ico{
    width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:800;color:#fff;background:var(--c);margin-bottom:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.16);
  }
  .card h3{font-size:15.5px;font-weight:800;margin-bottom:7px}
  .card .meta{font-size:11.5px;color:var(--c);font-weight:700;margin-bottom:11px}
  .card p{font-size:12.5px;color:var(--dim);line-height:1.85}

  .road{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 28px;box-shadow:var(--shadow)}
  .road-item{display:flex;gap:16px;padding:13px 0;border-bottom:1px dashed var(--line)}
  .road-item:last-child{border-bottom:none}
  .road-no{
    width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:#fff;background:var(--c);
  }
  .road-txt h4{font-size:13.5px;font-weight:800;margin-bottom:4px}
  .road-txt p{font-size:12px;color:var(--dim);line-height:1.8}
  .road-txt .lv{font-size:11px;color:var(--c);font-weight:700}

  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px}
  .ph-badge{
    width:92px;height:92px;border-radius:26px;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:#fff;margin-bottom:24px;
    background:linear-gradient(135deg,#ffb56b,#ff6b35);box-shadow:0 14px 34px rgba(255,107,53,.35);
    animation:float 3s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  .placeholder h2{font-size:22px;margin-bottom:12px}
  .placeholder p{color:var(--dim);font-size:13.5px;max-width:480px;line-height:2}
  .placeholder .dev-text{margin-top:20px;font-size:11px;color:var(--dim2);letter-spacing:2.5px}

  /* ============ 家长页（首页）============ */
  .p-sec{margin-bottom:34px}
  .p-note{font-size:12.5px;color:var(--dim);line-height:1.95;margin:-6px 0 16px}
  .p-note b{color:var(--brand)}
  .tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:12.5px}
  .tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);line-height:1.8;vertical-align:top}
  .tbl th{background:#f7f9fd;font-weight:800;color:#40506b;font-size:12px;white-space:nowrap}
  .tbl tr:last-child td{border-bottom:none}
  .tbl td b{color:var(--brand)}
  .tbl-lv td:nth-child(2){white-space:nowrap}
  .sp16{height:16px}
  .faq{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .faq details{border-bottom:1px solid var(--line)}
  .faq details:last-child{border-bottom:none}
  .faq summary{cursor:pointer;list-style:none;padding:15px 18px;font-size:13.5px;font-weight:800;color:#33415c;display:flex;gap:10px;align-items:flex-start;transition:.16s}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary:hover{background:#f8fafd}
  .faq summary::before{
    content:"Q";flex-shrink:0;width:20px;height:20px;border-radius:6px;background:var(--brand);color:#fff;
    font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .faq .a{padding:0 18px 16px 48px;font-size:12.5px;color:var(--dim);line-height:2}
  .faq .a b{color:var(--text)}
  .trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .trust .t{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
  .trust .t b{display:block;font-size:13px;font-weight:800;margin-bottom:6px}
  .trust .t span{font-size:11.5px;color:var(--dim);line-height:1.8}
  .quick{background:#16202f;color:#fff;border-radius:18px;padding:24px 28px;line-height:2.15;font-size:12.5px}
  .quick b{color:#ffb894}
  .hero-btns{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;position:relative;z-index:2}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:800;cursor:pointer;border:none;transition:.2s;font-family:inherit}
  .btn-main{background:linear-gradient(135deg,#ff8f5e,#ff6b35);color:#fff;box-shadow:0 10px 26px rgba(255,107,53,.35)}
  .btn-main:hover{transform:translateY(-2px)}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btn-ghost:hover{background:rgba(255,255,255,.24)}
  .promo-wide{
    display:flex;gap:28px;align-items:center;background:linear-gradient(135deg,#fff8f4,#ffffff);
    border:1px solid #ffe0cf;border-radius:20px;padding:28px 30px;box-shadow:0 14px 36px rgba(255,107,53,.12);
  }
  .promo-wide .pw-txt{flex:1;min-width:0}
  .promo-wide h3{font-size:17px;font-weight:800;color:#c2410c;margin-bottom:12px}
  .promo-wide p{font-size:12.5px;color:#5c6a82;line-height:2;margin-bottom:10px}
  .promo-wide .pw-qr{flex-shrink:0;text-align:center}
  .promo-wide .pw-qr img{width:150px;height:150px;border-radius:12px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.10)}
  .promo-wide .pw-qr span{display:block;font-size:11px;color:var(--dim);margin-top:9px}
  .promo-wide a{color:var(--brand);font-weight:800;text-decoration:none}

  /* ============ 家长页：卡片 / 台阶 / 时间轴 ============ */
  .tips{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
  .tips .tip{background:#fff;border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .tips .tip b{display:block;font-size:13.5px;font-weight:800;margin-bottom:8px}
  .tips .tip span{display:block;font-size:12px;color:#4a5a72;line-height:1.85}
  .tips .tip em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);line-height:1.8;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
  .pick{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-top:16px}
  .pick-row{display:flex;gap:16px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
  .pick-row:last-child{border-bottom:none}
  .pick-age{
    flex-shrink:0;width:126px;padding:6px 0;border-radius:9px;text-align:center;
    font-size:11.5px;font-weight:800;color:#fff;background:var(--brand);
  }
  .pick-txt h4{font-size:13.5px;font-weight:800;margin-bottom:4px}
  .pick-txt p{font-size:12px;color:var(--dim);line-height:1.75}
  .pace{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .pace-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
  .pace-card.main{border-color:#ffd0b8;box-shadow:0 14px 34px rgba(255,107,53,.14)}
  .pace-card .pc-tag{position:absolute;top:-1px;right:20px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;padding:3px 11px;border-radius:0 0 9px 9px}
  .pace-card h4{font-size:15px;font-weight:800;margin-bottom:14px}
  .pace-card .pc-row{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .pace-card .pc-row:last-of-type{border-bottom:none}
  .pace-card .pc-row b{font-size:15px;font-weight:800;color:var(--brand);min-width:86px}
  .pace-card .pc-row span{font-size:11.5px;color:var(--dim)}
  .pace-card > p{font-size:11.5px;color:var(--dim);line-height:1.8;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .steps{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 20px;box-shadow:var(--shadow);margin-top:16px}
  .steps .step{display:flex;gap:14px;padding:15px 0;border-bottom:1px dashed var(--line)}
  .steps .step:last-child{border-bottom:none}
  .steps .step i{
    flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;
    font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .steps .step b{display:block;font-size:13px;font-weight:800;margin-bottom:4px}
  .steps .step p{font-size:12px;color:var(--dim);line-height:1.8}
  .sidebar.collapsed .side-qr{display:none}
  .side-qr{
    margin:14px 16px 6px;padding:13px 12px 11px;border-radius:14px;text-align:center;
    background:linear-gradient(160deg,#fff8f4,#ffffff);border:1px solid #ffe0cf;
  }
  .side-qr img{width:110px;height:110px;border-radius:10px;background:#fff;display:block;margin:0 auto 9px}
  .side-qr span{font-size:11px;color:#c2410c;font-weight:800;line-height:1.5}

  @media(max-width:1420px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:1180px){.tips,.pace{grid-template-columns:1fr}}
  @media(max-width:1420px){.trust{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:1180px){.promo-wide{flex-direction:column;align-items:flex-start}}
  @media(max-width:1080px){.stat-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <a class="logo-link" href="https://codecombat.cn/" target="_blank" rel="noopener" title="访问 CodeCombat 扣哒世界官网">
          <img class="logo-img" src="assets/logo.webp" alt="CodeCombat 扣哒世界">
        </a>
        <div class="brand-text">
          <h1>扣哒考级</h1>
        </div>
        <button class="toggle" onclick="toggleSidebar()" title="折叠 / 展开">◀</button>
      </div>
      <div class="brand-slogan">先学后练再模考，GESP 一至八级在家也能通关</div>

/* 左侧目录的位置记忆：折叠时目录内容被隐藏、滚动位置会被清零，
   所以要在折叠前把位置存下来，展开后还原到"当前正在看的那个单元"。 */
let navScrollMemo = 0;

function rememberNavScroll(){
  if (nav) navScrollMemo = nav.scrollTop;
}

function restoreNavScroll(){
  if (!nav) return;
  requestAnimationFrame(() => {
    const act = nav.querySelector('.unit.active');
    if (act) act.scrollIntoView({block:'center'});
    else nav.scrollTop = navScrollMemo;
  });
}

function buildNav(){
  /* ---- 三大语言板块 ---- */
  BOARDS.forEach((b, bi) => {
    const board = document.createElement('div');
    board.className = 'board ' + b.id;

    const head = document.createElement('div');
    head.className = 'board-head open';        // 默认全展开
    head.innerHTML = `<span class="board-dot">${b.icon}</span>
      <span class="b-name">${b.name}</span>
      <span class="b-sub">${b.sub}</span>
      <span class="chev">▶</span>`;

    const body = document.createElement('div');
    body.className = 'board-body open';        // 默认全展开

    b.levels.forEach((lvNode) => {
      const lvWrap = document.createElement('div');
      lvWrap.className = 'level';

      const lvHead = document.createElement('div');
      lvHead.className = 'level-head open';    // 默认全展开
      lvHead.innerHTML = `<span class="lv-badge">${lvNode.lv} 级</span>
        <span class="lv-title">${lvNode.region}</span>
        <span class="lv-world">${lvNode.world}</span>
        <span class="chev">▶</span>`;

      const unitsWrap = document.createElement('div');
      unitsWrap.className = 'units open';      // 默认全展开

      lvNode.units.forEach((u, ui) => {
        const key = unitKey(b, lvNode.lv, ui);
        const ready = !!READY[key];
        const item = document.createElement('div');
        item.className = 'unit' + (ready ? ' ready' : '');
        item.dataset.key = key;
        item.dataset.search = (u.g + ' ' + u.k + ' ' + b.name + lvNode.region + lvNode.lv + '级').toLowerCase();

            <span class="u-k">${u.k}</span>
          </span>`;
        item.onclick = (e) => { e.stopPropagation(); openUnit(b, lvNode, ui, item); };
        unitsWrap.appendChild(item);
      });

      bindLevel(lvHead, unitsWrap);
      lvWrap.appendChild(lvHead);
      lvWrap.appendChild(unitsWrap);
      body.appendChild(lvWrap);
    });

    bindBoard(head, body);
    board.appendChild(head);
    board.appendChild(body);

    <span>需要老师带着学？扫码咨询</span>`;

/* ==================== 内容区 ==================== */
function collapseOuter(){
  if (!sidebar.classList.contains('collapsed')) {
    rememberNavScroll();
    sidebar.classList.add('collapsed');
    const t = sidebar.querySelector('.toggle');
    if (t) t.textContent = '▶';
  }
}

function expandSidebar(restore = true){
  sidebar.classList.remove('collapsed');
  const t = sidebar.querySelector('.toggle');
  if (t) t.textContent = '◀';
  if (restore) restoreNavScroll();
}

/* 折叠状态下点击板块 / 等级，先展开侧栏再展开该分组 */
function bindBoard(head, body){
  head.onclick = () => {
    if (sidebar.classList.contains('collapsed')) {
      expandSidebar(false);
      body.classList.add('open');
      head.classList.add('open');
      head.scrollIntoView({behavior:'smooth', block:'nearest'});
      return;
    }
    const open = body.classList.toggle('open');
    head.classList.toggle('open', open);
  };
}

function bindLevel(lvHead, unitsWrap){
  lvHead.onclick = () => {
    if (sidebar.classList.contains('collapsed')) {
      expandSidebar(false);
      unitsWrap.classList.add('open');
      lvHead.classList.add('open');
      lvHead.scrollIntoView({behavior:'smooth', block:'nearest'});
      return;
    }
    const open = unitsWrap.classList.toggle('open');
    lvHead.classList.toggle('open', open);
  };
}

function openUnit(b, lvNode, ui, el, keepSidebar){
  const key = unitKey(b, lvNode.lv, ui);
  nav.querySelectorAll('.unit').forEach(x => x.classList.remove('active'));
  if (el) el.classList.add('active');

  if (!READY[key]) {
    content.innerHTML = `
      <div class="placeholder">
        <div class="ph-badge">${lvNode.lv}</div>
        <h2>${lvNode.region} · 第 ${ui+1} 单元</h2>
        <p><strong>${lvNode.units[ui].g}</strong><br>
        <span style="font-size:12.5px">${lvNode.units[ui].k}</span><br><br>

        <div class="dev-text">COMING SOON</div>
      </div>`;

  }

  content.innerHTML = `<div class="frame-wrap">
      <iframe class="unit-frame" src="${unitFile(b, lvNode.lv, ui)}" title="${lvNode.units[ui].g}"></iframe>
    </div>`;

}

/* 首页内的锚点跳转 */
function jumpTo(id){
  const el = content.querySelector('#' + id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function jumpBoard(id){
  const sel = id === 'exam' ? '.board.exam' : '.board.' + id;
  const board = nav.querySelector(sel);
  if (!board) return;
  board.querySelector('.board-body').classList.add('open');
  board.querySelector('.board-head').classList.add('open');
  const first = board.querySelector('.units');
  if (first) { first.classList.add('open'); first.previousElementSibling.classList.add('open'); }
  board.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleSidebar(){
  const c = sidebar.classList.toggle('collapsed');
  sidebar.querySelector('.toggle').textContent = c ? '▶' : '◀';
  if (c) rememberNavScroll();     // 折叠前记下目录位置
  else   restoreNavScroll();      // 展开后回到那个位置
}

document.getElementById('searchInput').addEventListener('input', function(){
  const kw = this.value.trim().toLowerCase();
  nav.querySelectorAll('.unit').forEach(u => {
    u.style.display = (!kw || u.dataset.search.includes(kw)) ? '' : 'none';
  });
  if (kw){
    nav.querySelectorAll('.board-body').forEach(b => b.classList.add('open'));
    nav.querySelectorAll('.board-head').forEach(h => h.classList.add('open'));
    nav.querySelectorAll('.units').forEach(g => g.classList.add('open'));
    nav.querySelectorAll('.level-head').forEach(h => h.classList.add('open'));
  }
});

buildNav();

/* 打开先看面向家长的首页；点"从 Python 一级第 1 单元开始"再进单元 */
function openFirstUnit(){
  const b = BOARDS[0], lvNode = b.levels[0];
  const el = nav.querySelector(`.unit[data-key="${unitKey(b, lvNode.lv, 0)}"]`);
  openUnit(b, lvNode, 0, el, true);   // 第 5 个参数 true = 不自动收起侧栏
}
showWelcome();
