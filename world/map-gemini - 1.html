<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码秘境 · 世界地图</title>
<style>
  :root{
    --shadow:#7b3ff2; --forest:#2fce8e; --desert:#f0a93b;
    --cloud:#7ec8e3; --glacier:#9fe7ff;
    --highlight: #00e5ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#0b0e1a;
    font-family:"Noto Serif SC","Songti SC",serif;color:#e8e6f0;}

  /* ===== 世界总览视图 ===== */
  #world{position:fixed;inset:0;transition:transform 1.1s cubic-bezier(.7,0,.3,1),
    filter .9s ease, opacity .9s ease;}

  /* 地图舞台：用 img 完整显示整张图，与 tool.html 显示方式一致，保证坐标系统一 */
  #map-stage{position:absolute;inset:0;width:100%;height:100%;will-change:transform;}
  #map-img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:fill;   /* 与工具的 preserveAspectRatio=none 对应：完整拉伸铺满，不裁剪 */
    user-select:none;-webkit-user-drag:none;display:block;}

  .fog{position:absolute;inset:-10%;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(11,14,26,.55) 100%);
    opacity:.8;will-change:transform;}
  .fog.f2{background:radial-gradient(ellipse at 40% 30%,rgba(120,140,200,.08),transparent 60%);
    animation:drift 26s ease-in-out infinite alternate;}
  .fog.f3{background:radial-gradient(ellipse at 70% 70%,rgba(180,160,220,.07),transparent 55%);
    animation:drift 34s ease-in-out infinite alternate-reverse;}
  @keyframes drift{from{transform:translate(-2%,-1%) scale(1.05);}
    to{transform:translate(3%,2%) scale(1.1);}}
  .vignette{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 280px 80px rgba(0,0,0,.85);}

  /* SVG 与 img 同坐标系：同样铺满、同样 preserveAspectRatio=none */
  #map-svg {position:absolute;inset:0;width:100%;height:100%;z-index:10;}
  .region-poly {fill:transparent;stroke:transparent;vector-effect:non-scaling-stroke;
    stroke-width:3px;cursor:pointer;transition:all 0.35s ease;}
  .region-poly:hover, .region-poly.active {
    fill:rgba(0,229,255,0.15);stroke:var(--highlight);
    filter:drop-shadow(0 0 8px var(--highlight));}

  .region-label {position:absolute;transform:translate(-50%,-50%);font-size:18px;
    letter-spacing:2px;font-weight:bold;text-shadow:0 0 10px #000,0 2px 4px #000;
    white-space:nowrap;pointer-events:none;z-index:11;
    transition:transform .35s ease, color .35s ease;}
  .region-label.hovered {transform:translate(-50%,-50%) scale(1.15);color:var(--highlight);}

  #world.zoom{transform:scale(2.4);filter:blur(6px) brightness(.6);opacity:0;}

  /* ===== 区域详情视图 ===== */
  #detail{position:fixed;inset:0;display:none;opacity:0;
    transition:opacity .8s ease;background:#05060d;z-index:20;}
  #detail.show{display:block;opacity:1;}
  .poster{position:absolute;inset:0;background-size:cover;background-position:center;
    animation:ken 18s ease-in-out infinite alternate;}
  @keyframes ken{from{transform:scale(1)}to{transform:scale(1.12)}}
  .poster::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,rgba(5,6,13,.92) 0%,rgba(5,6,13,.55) 45%,transparent 100%);}
  .detail-content{position:absolute;top:0;left:0;height:100%;width:46%;
    padding:7vh 5vw;display:flex;flex-direction:column;justify-content:center;z-index:2;}
  .detail-content h1{font-size:48px;letter-spacing:4px;margin-bottom:6px;
    text-shadow:0 0 20px currentColor;}
  .detail-content .en{font-size:16px;letter-spacing:6px;opacity:.6;
    text-transform:uppercase;margin-bottom:24px;}
  .detail-content p.intro{font-size:17px;line-height:1.9;opacity:.9;margin-bottom:28px;}
  .knowledge{display:flex;flex-wrap:wrap;gap:12px;}
  .kcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);
    border-radius:10px;padding:12px 16px;font-size:14px;backdrop-filter:blur(4px);
    display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(14px);}
  #detail.show .kcard{animation:rise .6s ease forwards;}
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .back{position:absolute;top:30px;left:30px;z-index:3;cursor:pointer;
    background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);
    color:#fff;padding:10px 18px;border-radius:30px;font-family:inherit;
    letter-spacing:2px;font-size:14px;transition:background .3s;}
  .back:hover{background:rgba(255,255,255,.18);}

  /* 全局UI */
  #mute{position:fixed;top:24px;right:28px;z-index:50;cursor:pointer;
    background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);
    color:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;}

  /* ===== 开场加载/进入动画 ===== */
  #intro{position:fixed;inset:0;z-index:100;background:#05060d;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    transition:opacity 1s ease;}
  /* 开场预览用 img 完整显示，避免裁剪不一致；放大动画放在外层 */
  #intro .intro-map{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;
    transform:scale(0.55);filter:blur(14px) brightness(.5);opacity:.5;
    transition:transform 2.2s cubic-bezier(.5,0,.2,1), filter 2.2s ease, opacity 2.2s ease;}
  #intro.loaded .intro-map{transform:scale(1);filter:blur(2px) brightness(.7);opacity:.9;}
  #intro .intro-overlay{position:absolute;inset:0;
    background:radial-gradient(ellipse at center,transparent 30%,rgba(5,6,13,.85) 100%);}

  .intro-center{position:relative;z-index:2;text-align:center;}
  .intro-center h2{font-size:38px;letter-spacing:10px;opacity:.95;
    text-shadow:0 0 24px rgba(0,229,255,.6);margin-bottom:34px;}

  /* 进度条 */
  .progress-wrap{width:340px;max-width:70vw;margin:0 auto;}
  .progress-bar{height:4px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#7ec8e3,#00e5ff);
    box-shadow:0 0 12px #00e5ff;transition:width .2s ease;}
  .progress-text{margin-top:12px;font-size:13px;letter-spacing:3px;opacity:.6;}

  /* 进入按钮（加载完成后出现） */
  #enter-btn{position:relative;z-index:2;margin-top:40px;cursor:pointer;
    padding:14px 46px;font-family:inherit;font-size:17px;letter-spacing:4px;color:#cfeaff;
    background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.6);border-radius:40px;
    opacity:0;pointer-events:none;transition:opacity .8s ease, background .3s, transform .3s;
    text-shadow:0 0 10px rgba(0,229,255,.6);box-shadow:0 0 22px rgba(0,229,255,.25);}
  #enter-btn.show{opacity:1;pointer-events:auto;animation:btnPulse 2.4s ease-in-out infinite;}
  #enter-btn:hover{background:rgba(0,229,255,.2);transform:scale(1.06);}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 22px rgba(0,229,255,.25);}
    50%{box-shadow:0 0 38px rgba(0,229,255,.55);}}
</style>
</head>
<body>

<!-- ===== 开场加载页 ===== -->
<div id="intro">
  <img class="intro-map" id="introMap" src="world.png" alt="">
  <div class="intro-overlay"></div>
  <div class="intro-center">
    <h2>代码秘境</h2>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">加载世界中… 0%</div>
    </div>
  </div>
  <button id="enter-btn">进 入 世 界</button>
</div>

<button id="mute" title="静音">🔊</button>

<div id="world">
  <!-- 地图舞台：img 与 svg 同坐标系 -->
  <div id="map-stage">
    <img id="map-img" src="world.png" alt="代码秘境世界地图">
    <svg id="map-svg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
  </div>
  <div class="fog f2"></div>
  <div class="fog f3"></div>
  <div class="fog"></div>
  <div class="vignette"></div>
</div>

<div id="detail">
  <div class="poster" id="poster"></div>
  <button class="back" id="back">← 返回世界</button>
  <div class="detail-content" id="dContent"></div>
</div>

<audio id="sfx-enter" src="sfx-enter.mp3"></audio>
<audio id="sfx-hover" src="sfx-hover.mp3"></audio>
<audio id="sfx-click" src="sfx-click.mp3"></audio>
<audio id="sfx-region" src="sfx-region.mp3"></audio>
<audio id="bgm" src="bgm.mp3" loop></audio>

<script>
/* ===== 区域数据（坐标沿用你用 tool.html 描的，现在坐标系已统一，可直接对应） ===== */
const REGIONS = [
  { id:'glacier', name:'封神冰川', en:'Divine Glacier', x:33, y:20, points:"16.2,29.8 16.3,33.4 19.3,35.8 22.6,34.5 25.5,31.5 32.2,28.1 37.3,23.8 42.8,19.3 45.7,20 48.2,18.4 48.9,12.9 46.9,7.6 42.7,6.2 36.3,14.7 32.9,19.5 29.8,18.1 26.3,19.8 22.8,22.4 21.9,26 17.9,28.1 16.2,29.4",
    intro:'终焉之地的永冻冰原，是封神之路的最后考验。', poster:'poster-glacier.jpg', pointsData:[['🏗️','综合项目'],['🚀','高级算法']] },
  { id:'cloud', name:'安息云峰', en:'Cloudrip Mountain', x:33, y:35, points:"28,40.5 30.5,40.8 35.1,40.8 40,41.2 44.7,39.2 51.6,36 55.3,34.9 55.3,30.4 55.9,25.4 53.4,22 50.8,18.7 47.2,18.7 42,20.3 38.2,22 32.5,25.8 28.1,28.9 24.5,31.4 22.6,36 22.9,37.8",
    intro:'高耸入云的山脉是强者的试炼场。', poster:'poster-cloud.jpg', pointsData:[['📊','数组'],['🗂️','数据结构']] },
  { id:'youth', name:'少年冒险海岛', en:'Youth Island', x:75, y:23, points:"65.5,15.3 64.1,17 62.3,19 62.8,22.4 62,25.4 62.4,28.7 63.6,30.8 65.9,32.6 68.2,32.4 69.8,34 71.5,32.9 72.9,34.1 73.6,37.7 74.4,41.9 75,42.8 75.5,39.7 76,37.4 77.6,36 79.2,35.8 80,35.4 79.3,31.8 78,28 76.7,24.3 76.7,19.3 76.1,15 73.9,13.2 72.2,14.6 70.8,17.8 69.5,15.6 68.3,13.8 65.5,15",
    intro:'充满未知与惊喜的新手启航之地。', poster:'poster-youth.jpg', pointsData:[['⛵','基础认知'],['🧭','方向指南']] },
  { id:'forest', name:'边际森林', en:'Border Forest', x:58, y:43, points:"54.9,28.6 52.8,30.3 49.3,31.5 46.5,34.6 43.7,37.2 39.9,38.3 37.3,38.5 33.2,40 29.5,41.1 28.3,44.8 30.3,49.3 33.8,50.2 38.8,50.5 41.8,50.5 45.1,50.3 47.3,49.7 50.3,52.2 52.6,53.9 54.8,54.5 57.2,57 60.1,58.8 62.7,61.4 64.1,66.5 64.8,72.4 66.8,78.6 69.5,76.1 71.6,75.5 71.7,72.4 71.4,66.7 72.8,63.5 71,56.2 71.5,52.8 71.3,45.9 65.4,38.3 63.1,34 59.8,35.1 57.6,36.3 55.4,32.3 55,28.3",
    intro:'茂密的丛林考验冒险者的判断力。', poster:'poster-forest.jpg', pointsData:[['🔁','循环'],['🔀','条件判断']] },
  { id:'desert', name:'流金沙漠', en:'Sarven Desert', x:58, y:68, points:"41.7,63.9 40.7,68.1 41.1,73.2 42.3,76.9 43.8,80.4 46.5,81.7 49.1,81 52.5,78.6 54.8,76.3 56.7,79.2 57.8,80.4 60.2,77.8 61,75.9 61.4,73 61.4,69.2 60.1,64.8 57.6,62.1 54.8,60.7 51,60.4 46,61.6 41.8,63.8",
    intro:'无垠的金色沙海下埋藏着古老的智慧。', poster:'poster-desert.jpg', pointsData:[['⚙️','函数'],['📥','参数']] },
  { id:'shadow', name:'暗影地牢', en:'Shadow Dungeon', x:58, y:88, points:"56.1,90.8 58.9,90 60.3,88 62.2,88.6 62.8,91.4 62.5,96.6 64.9,93.4 66.7,89.7 67.2,85.5 64.4,82.6 63.1,78.4 60.9,78.6 58,81.3 56.1,79.3 54.9,76.9 51.7,82 49.6,83.2 47.2,83.3 44.7,82.6 43.1,80.1 40.9,77.2 39.6,74.6 38.9,70.4 37.9,68.7 35.5,69.2 34.7,71.6 35.3,74.4 33.7,79.2 35,82 37.1,83.7 37.3,80.9 38.6,80.4 40.9,86.6 43.9,96.6 45.9,92.1 48,89.4 49.2,88.4 51.1,90.4 56.1,90.6",
    intro:'幽暗的地下城是冒险者踏上征途的第一站。', poster:'poster-shadow.jpg', pointsData:[['📦','变量'],['💬','基础语法']] },
  { id:'web1', name:'网页开发1森林岛', en:'Web Dev 1', x:16, y:55, points:"14.1,59.1 13.4,57.4 14.6,56.7 16.4,56 17.8,56.7 18.7,58.2 17.5,59.4 15.7,59 14,59",
    intro:'搭建网络世界的第一块基石。', poster:'poster-web1.jpg', pointsData:[['📝','HTML'],['🎨','CSS']] },
  { id:'web2', name:'网页开发2森林岛', en:'Web Dev 2', x:15, y:80, points:"13.6,66.8 13.6,69.9 13.8,73.6 15.2,73.8 17.3,72.7 18.8,70.7 18.2,68.4 17.3,66.8 16.8,64.7 16.2,63.8 14.9,65.5 13.6,67",
    intro:'赋予网页灵魂与交互的进阶岛屿。', poster:'poster-web2.jpg', pointsData:[['⚡','JavaScript'],['🔌','API接口']] },
  { id:'game1', name:'游戏开发1森林岛', en:'Game Dev 1', x:88, y:47, points:"76.5,42.8 77.7,45.4 80,46.3 80.7,48.2 82.2,51.4 82.9,48.6 82.1,45.7 81.6,42.5 80.7,40.5 79.1,40.5 77.2,41.1 76.3,41.5 76.6,42.9",
    intro:'游戏机制的初探之地。', poster:'poster-game1.jpg', pointsData:[['🎮','基础逻辑'],['👾','角色控制']] },
  { id:'game2', name:'游戏开发2森林岛', en:'Game Dev 2', x:85, y:60, points:"75.8,53.9 74.7,55.4 74.2,58.5 74.8,61 76.3,61.3 77,59 77.4,56.2 76,53.6",
    intro:'构建复杂游戏生态与碰撞的世界。', poster:'poster-game2.jpg', pointsData:[['💥','物理引擎'],['🎬','动画系统']] },
  { id:'game3', name:'游戏开发3森林岛', en:'Game Dev 3', x:88, y:80, points:"78.9,71.6 78.6,75.8 79,80.4 80.8,82.4 83.4,82.3 85,79.2 85.6,75.8 84,71.8 81.8,71.6 79.8,70.9 78.9,71.9",
    intro:'大型多人在线逻辑的终极考验。', poster:'poster-game3.jpg', pointsData:[['🌐','网络同步'],['🏆','性能优化']] }
];

const world = document.getElementById('world');
const svgLayer = document.getElementById('map-svg');
const mapStage = document.getElementById('map-stage');
const detail = document.getElementById('detail');
const poster = document.getElementById('poster');
const dContent = document.getElementById('dContent');
const sfx = id => document.getElementById(id);
let muted = false;

function play(id){ if(muted) return; const a=sfx(id); if(a){a.currentTime=0;a.play().catch(()=>{});} }

/* 注入 SVG 多边形与文字标签 */
REGIONS.forEach((r) => {
  const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
  poly.setAttribute("points", r.points);
  poly.setAttribute("class", "region-poly");
  poly.setAttribute("data-id", r.id);

  const label = document.createElement("div");
  label.className = "region-label";
  label.style.left = r.x + "%";
  label.style.top = r.y + "%";
  label.textContent = r.name;

  poly.addEventListener('mouseenter', () => { play('sfx-hover'); label.classList.add('hovered'); });
  poly.addEventListener('mouseleave', () => { label.classList.remove('hovered'); });
  poly.addEventListener('click', () => openRegion(r));

  svgLayer.appendChild(poly);
  world.appendChild(label);
});

/* 打开区域详情 */
function openRegion(r){
  play('sfx-click');
  world.classList.add('zoom');
  setTimeout(()=>{
    play('sfx-region');
    poster.style.backgroundImage=`url('${r.poster}'), radial-gradient(circle at 50% 40%, rgba(0,229,255,0.2), #05060d 70%)`;
    dContent.style.color="#00e5ff";
    dContent.innerHTML=`
      <h1>${r.name}</h1>
      <div class="en">${r.en}</div>
      <p class="intro" style="color:#e8e6f0">${r.intro}</p>
      <div class="knowledge">
        ${r.pointsData.map((p,i)=>`<div class="kcard" style="color:#fff;animation-delay:${.2+i*.15}s">
          <span style="font-size:20px">${p[0]}</span>${p[1]}</div>`).join('')}
      </div>`;
    detail.classList.add('show');
  },800);
}

/* 返回世界 */
document.getElementById('back').addEventListener('click',()=>{
  play('sfx-hover');
  detail.classList.remove('show');
  setTimeout(()=>{ detail.classList.remove('show'); world.classList.remove('zoom'); },500);
});

/* 鼠标视差：img 和 svg 一起轻微平移（同步，不缩放，避免坐标错位） */
const fogs=document.querySelectorAll('.fog');
document.addEventListener('mousemove',e=>{
  const dx=(e.clientX/window.innerWidth-.5);
  const dy=(e.clientY/window.innerHeight-.5);
  // 地图舞台整体平移，img 与 svg 一起动，二者坐标系始终一致
  mapStage.style.transform=`translate(${dx*-12}px,${dy*-12}px)`;
  const labels = document.querySelectorAll('.region-label');
  labels.forEach(l => { l.style.marginLeft = dx*-12 + 'px'; l.style.marginTop = dy*-12 + 'px'; });
  fogs.forEach((f,i)=>{f.style.marginLeft=dx*(20+i*15)*-1+'px'; f.style.marginTop=dy*(20+i*15)*-1+'px';});
});

/* 静音开关 */
document.getElementById('mute').addEventListener('click',function(){
  muted=!muted;
  this.textContent=muted?'🔇':'🔊';
  sfx('bgm').muted=muted;
});

/* ===== 开场加载流程 ===== */
const intro = document.getElementById('intro');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const enterBtn = document.getElementById('enter-btn');

requestAnimationFrame(()=> intro.classList.add('loaded'));

let prog = 0;
const timer = setInterval(()=>{
  prog += Math.random()*12 + 4;
  if(prog >= 100){
    prog = 100;
    clearInterval(timer);
    progressText.textContent = '加载完成';
    enterBtn.classList.add('show');
  }
  progressFill.style.width = prog + '%';
  progressText.textContent = prog < 100 ? `加载世界中… ${Math.floor(prog)}%` : '加载完成';
}, 220);

enterBtn.addEventListener('click', ()=>{
  play('sfx-enter');
  sfx('bgm').volume = 0.3; sfx('bgm').play().catch(()=>{});
  intro.style.opacity = 0;
  setTimeout(()=> intro.style.display = 'none', 1000);
});
</script>

<div data-info-wiki-backlink style="text-align:center;padding:18px 12px;color:#64748b;font:13px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif"><a href="../index.html" style="color:#4f46e5;text-decoration:none;font-weight:700">← 返回 CodeCombat 信息百科</a></div>
</body>
</html>
